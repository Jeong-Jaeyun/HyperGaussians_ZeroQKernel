[project]
name = "zeroqkernel-ids"
version = "0.1.0"
description = "Scaffold for Hyper-Gaussian Quantum Kernel Zero-Day IDS research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26.0",
  "PyYAML>=6.0.1",
  "pandas>=2.2.0"
]

[project.optional-dependencies]
ml = [
  "scikit-learn>=1.5.0"
]
quantum = [
  "qiskit>=1.2.0"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
